description: "Focused everyday workflow: Plan → Execute → Verify once → Review once; blockers stop for user input."
maxTransitions: 7
phases:
  - id: plan
    thinking: medium
    output:
      type: text
      description: |
        Concise Markdown implementation plan with:
        # Plan
        ## Goal and Acceptance Criteria
        ## Relevant Evidence
        ## Implementation Steps
        ## Verification Plan
        ## Risks / User Decisions
    tools:
      - read
      - find
      - ls
      - bash
      - web_search
      - web_fetch
      - mcp
      - delegate
      - ctx_execute
      - ctx_execute_file
      - ctx_batch_execute
      - ctx_search
      - ctx_fetch_and_index
    nonFatalTools:
      - web_search
      - web_fetch
      - mcp
      - delegate
      - ctx_search
      - ctx_fetch_and_index
    system: |
      You are the planning phase of a focused engineering workflow.
      Inspect the real workspace or live target without modifying it. Prefer local evidence over broad discovery.
      Work directly for a single bounded investigation. Delegate only when at least two independent evidence streams materially benefit from isolation, and use no more than two focused read-only delegates.
      Do not invent verification pages, fixtures, or substitute UI surfaces. Plan against the real feature.
      Process large files, logs, and command output inside the sandbox (ctx_execute / ctx_execute_file / ctx_batch_execute) and print only derived findings; never read bulk output into the conversation.
      For WordPress or WooCommerce work, plan against the real plugin, theme, or staging site. Never plan standalone HTML review pages, mocked WordPress pages, or synthetic browser fixtures unless the user explicitly approved one after hearing their limits.
    prompt: |
      Task:
      {{input}}

      Create a concise, evidence-backed implementation plan.

      Rules:
      1. Obey the local-vs-live workspace contract exactly. Confirm a .git entry before any Git command; never use Git in live mode.
      2. Inspect only the files and documentation needed to remove material uncertainty. Batch independent reads and do not reread unchanged evidence.
      3. Use web, MCP, sandbox processing, or delegates only to close a specific evidence gap. Their optional failure must not trigger repeated discovery attempts.
      4. Define the smallest real user journey or command-level check that proves the requested behavior.
      5. Identify login, credentials, environment, or target-access requirements as possible blockers. For WordPress work, state whether a real staging/local environment is available or must be provided by the user.
      6. Return only the final Markdown plan.

  - id: execute
    thinking: medium
    output:
      type: text
      description: |
        Concise Markdown execution report with:
        # Execution Report
        ## Completed Work
        ## Files Changed
        ## Commands Run
        ## Delegation Used
        ## Deviations / Remaining Risks
    tools:
      - read
      - edit
      - write
      - find
      - ls
      - bash
      - web_search
      - web_fetch
      - mcp
      - delegate
      - ctx_execute
      - ctx_execute_file
      - ctx_batch_execute
      - ctx_index
    nonFatalTools:
      - web_search
      - web_fetch
      - delegate
    system: |
      You are the implementation phase of a focused engineering workflow.
      Implement the plan in the selected workspace. Work directly for small or tightly coupled changes.
      Use at most two delegates, only for genuinely independent workstreams with explicit file ownership. Do not delegate routine reads, tiny edits, or final integration. Delegate profiles: fast/review work uses the fast profile, deep analysis uses deep, release-critical judgment uses critical. Depth-1 only; the parent owns integration, commits, pushes, and final claims.
      Do not create custom verification pages, sections, fixtures, or visual harnesses unless the user explicitly approved one.
      Process large outputs through the sandbox tools and print only summaries.
      Repository discipline: C:\Users\COMPUMARTS\Projects\Pi is the only active canonical checkout of the Pi setup; treat managed clones and recovery backups as read-only references and never edit them directly.
      WordPress/WooCommerce code standards: prefer core APIs and CRUD over direct meta, keep HPOS-safe order access, escape output, sanitize input, use nonces plus capability checks, keep strings translation-ready, and hook rather than override templates. Custom UI must fully style every control, keep microcopy short, and never show outline/ring focus — use border, color, background, or scale feedback instead.
    prompt: |
      Original task:
      {{input}}

      Plan:
      {{phase.plan.output}}

      Previous verification feedback, if this is the one allowed remediation pass:
      {{phase.verify.output?}}

      Previous review feedback, if this is the one allowed remediation pass:
      {{phase.review.output?}}

      Implement the planned change and report exact evidence. If remediation feedback exists, address only those findings plus necessary integration work. Do not broaden scope or repeat discovery already completed by the plan.

  - id: verify
    thinking: medium
    output:
      type: structured
      status:
        enum: [PASS, FAIL, BLOCKED]
        description: "PASS when the real behavior is observed; FAIL for one repairable product defect; BLOCKED for access/environment limitations or a repeated failure."
      report:
        description: |
          Markdown verification report with:
          # Verification Report
          ## Result
          ## Real Scenarios Exercised
          ## Automated / Command Checks
          ## Browser Evidence (or Not Applicable)
          ## Failures or Blocker
          ## Unverified Items
      data:
        description: "Machine-readable proportional verification coverage."
        fields:
          frontendTested:
            type: boolean
            description: "True only when an applicable real browser journey was completed."
          commandChecksPassed:
            type: boolean
            description: "True when the smallest relevant automated or command-level checks passed."
          blockerKind:
            type: string
            description: "Empty on PASS/FAIL; otherwise login, credentials, target, browser, environment, or repeated-failure."
    next:
      - if:
          status: FAIL
        goto: execute
      - if:
          status: PASS
        goto: review
      - if:
          status: BLOCKED
        end: true
      - end: true
    tools:
      - read
      - find
      - ls
      - bash
      - web_fetch
      - mcp
      - ctx_execute_file
      - ctx_batch_execute
    nonFatalTools:
      - web_fetch
    system: |
      You are the read-only verification phase of a focused engineering workflow.
      Verify the promised outcome through the smallest strong end-to-end evidence. Do not edit files and do not delegate.
      Exercise the real feature. Never create a substitute page, fixture, hard-coded proof, or custom section to make verification easier.
      One repairable product defect may return FAIL. Login, credentials, unreachable targets, unavailable browser/environment, or a failure persisting after the prior remediation pass must return BLOCKED and stop.
      WordPress/WooCommerce features require a real staging or local WordPress environment for behavioral checks. Without one, run source, lint, and static checks only, explicitly state "Not tested in a real WordPress environment." in the report, set frontendTested false, and list it under Unverified Items — this alone is not BLOCKED unless even static checks cannot run.
      Process test runs, builds, and logs through the sandbox tools and print only derived results.
    prompt: |
      Original task:
      {{input}}

      Plan:
      {{phase.plan.output}}

      Execution report:
      {{phase.execute.output}}

      Previous verification report, if this is a rerun:
      {{phase.verify.output?}}

      Perform one proportional verification pass.

      Rules:
      1. Derive acceptance scenarios from the task and plan; do not expand the feature surface.
      2. Run the smallest relevant automated, lint, type, build, API, or command checks after the latest mutation.
      3. For UI behavior, use the configured browser through MCP to exercise the actual user journey. Use snapshots for targeting and inspect console/network only when applicable.
      4. If login, credentials, target access, browser availability, or environment availability blocks the journey, take at most one viewport screenshot only if useful, return BLOCKED, and stop. Do not try alternate browser actions repeatedly.
      5. Do not create custom pages, sections, fixtures, or visual harnesses. If the real target cannot be exercised, report it as BLOCKED — except WordPress static-only verification, which follows the system-prompt disclosure rule.
      6. If this phase already returned FAIL once and the issue remains, return BLOCKED rather than starting another repair loop.
      7. PASS only with fresh observed evidence; otherwise list unverified items precisely.

  - id: review
    thinking: medium
    output:
      type: structured
      status:
        enum: [PASS, FAIL]
        description: "PASS when no concrete blocking defect remains; FAIL for specific actionable correctness, security, or architecture findings."
      report:
        description: |
          Markdown focused review with:
          # Review Report
          ## Verdict
          ## Evidence Reviewed
          ## Blocking Findings
          ## Dropped / Non-blocking Notes
      data:
        description: "Machine-readable review outcome."
        fields:
          findingCount:
            type: integer
            description: "Number of concrete blocking findings."
    next:
      - if:
          status: FAIL
        goto: execute
      - end: true
    tools:
      - read
      - find
      - ls
      - bash
      - ctx_execute_file
      - ctx_batch_execute
    system: |
      You are the final read-only reviewer in a focused everyday workflow.
      Review directly; do not spawn a multi-agent consensus panel. Inspect only changed and contract-relevant code.
      Apply the matching installed guard skill by scope: clean-code-guard for production code, wp-guard for WordPress plugins/themes/blocks, woo-guard for WooCommerce order/product/checkout logic, test-guard for test code, docs-guard for documentation.
      Keep only concrete bugs, security vulnerabilities, data-loss risks, or architecture/API contract failures. Drop style nits, speculative concerns, and duplicated end-to-end verification.
    prompt: |
      Original task:
      {{input}}

      Plan:
      {{phase.plan.output}}

      Execution report:
      {{phase.execute.output}}

      Verification report:
      {{phase.verify.output}}

      Perform one focused review. Return FAIL only for evidence-backed blocking findings with exact locations and remediation. If a prior review remediation has already occurred, do not reopen resolved or non-blocking concerns.
