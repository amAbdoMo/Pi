name: Validate Pi setup

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --yes . --help
      - run: npm pack --dry-run --json
      - run: bash -n install.sh

  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $_.FullName), [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "$($_.FullName): $($parseErrors | Out-String)" }
          }
      - name: Test Windows Nerd Font setup
        shell: pwsh
        run: ./tests/setup-terminal-font.test.ps1
      - name: Smoke-test inferred npx installer
        shell: pwsh
        run: npx --yes . --help
      - name: Diagnose clean runner
        shell: pwsh
        run: .\setup.ps1 diagnose -Json
      - name: Install and verify clean runner
        if: github.event_name == 'push'
        shell: pwsh
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}\pi-agent
          PI_WORKBENCH_PACKAGE_SPEC: git:github.com/amAbdoMo/Pi@${{ github.sha }}
        run: |
          .\setup.ps1 install -SkipFfmpeg -SkipTerminal
          .\setup.ps1 verify -Json
